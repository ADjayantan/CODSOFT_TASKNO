<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supply Chain Operations Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen">
    
    <!-- Navbar -->
    <nav class="bg-blue-900 text-white p-4 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold"><i class="fas fa-network-wired mr-2"></i> NexusTiq24 Operations Center</h1>
            <span class="text-blue-200 text-sm">System Status: <span class="text-green-400 font-bold">Online</span></span>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 mt-4">
        
        <!-- Left Column: Database Status -->
        <div class="lg:col-span-1 space-y-6">
            <!-- Warehouse Stock Widget -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <h2 class="text-lg font-bold text-slate-700 mb-4 border-b pb-2"><i class="fas fa-warehouse mr-2"></i> Live Warehouse Stock</h2>
                <div id="stock-container" class="space-y-4">
                    <p class="text-sm text-slate-500 animate-pulse">Loading database...</p>
                </div>
            </div>
            
            <!-- Pending Orders Widget -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <h2 class="text-lg font-bold text-slate-700 mb-4 border-b pb-2"><i class="fas fa-shopping-cart mr-2"></i> Pending Orders</h2>
                <div id="orders-container" class="space-y-3"></div>
            </div>
        </div>

        <!-- Right Column: Inbox & AI Analysis -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Automated Alert Inbox -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-lg font-bold text-slate-700"><i class="fas fa-inbox mr-2"></i> Incoming Supplier Notices</h2>
                    <span class="bg-red-100 text-red-800 text-xs font-bold px-2 py-1 rounded-full">2 Unread</span>
                </div>
                
                <div id="inbox-container" class="space-y-3">
                    <p class="text-sm text-slate-500 animate-pulse">Syncing inbox...</p>
                </div>
            </div>

            <!-- AI Impact Assessment Panel -->
            <div id="analysis-panel" class="hidden bg-white rounded-xl shadow-md border-l-4 border-blue-600 p-6">
                <div class="flex justify-between items-start mb-4">
                    <h2 class="text-2xl font-bold text-slate-800"><i class="fas fa-robot text-blue-600 mr-2"></i> AI Impact Assessment</h2>
                    <div id="loading" class="hidden text-blue-600 font-semibold animate-pulse"><i class="fas fa-spinner fa-spin mr-1"></i> Analyzing Network...</div>
                </div>
                
                <div id="results" class="hidden">
                    <div id="summary" class="mb-6 text-lg p-4 bg-slate-50 rounded-lg border border-slate-100"></div>
                    
                    <h3 class="text-lg font-bold mb-3 text-slate-700">Affected Orders</h3>
                    <div id="affected-orders" class="space-y-4 mb-6"></div>
                    
                    <div class="p-4 bg-blue-50 rounded-lg border border-blue-200">
                        <h3 class="text-lg font-bold text-blue-900 mb-2"><i class="fas fa-lightbulb mr-2"></i> AI Recommended Action</h3>
                        <p id="recommendation" class="text-blue-800 leading-relaxed font-medium"></p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Load Database Overview on Startup
        async function loadDatabase() {
            try {
                const res = await fetch('/api/database');
                const db = await res.json();
                
                // Render Stock
                const stockHtml = db.stock.map(item => `
                    <div>
                        <div class="flex justify-between text-sm font-semibold text-slate-600 mb-1">
                            <span>${item.name} (${item.part_id})</span>
                            <span>${item.quantity_in_warehouse} Units</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-2">
                            <div class="bg-blue-600 h-2 rounded-full" style="width: ${Math.min((item.quantity_in_warehouse/500)*100, 100)}%"></div>
                        </div>
                    </div>
                `).join('');
                document.getElementById('stock-container').innerHTML = stockHtml;

                // Render Orders
                const ordersHtml = db.orders.map(order => `
                    <div class="p-3 bg-slate-50 border border-slate-100 rounded-lg">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-sm text-slate-800">${order.order_id}</span>
                            <span class="text-xs text-slate-500"><i class="far fa-calendar-alt"></i> ${order.deadline}</span>
                        </div>
                        <div class="text-xs text-slate-600">${order.customer}</div>
                    </div>
                `).join('');
                document.getElementById('orders-container').innerHTML = ordersHtml;
                
            } catch (e) {
                document.getElementById('stock-container').innerHTML = '<span class="text-red-500 text-sm">Failed to load database</span>';
            }
        }

        // Load Inbox
        async function loadInbox() {
            try {
                const res = await fetch('/api/inbox');
                const emails = await res.json();
                
                const inboxHtml = emails.map(email => `
                    <div class="group border border-slate-200 p-4 rounded-lg hover:border-blue-400 hover:bg-blue-50 transition-colors cursor-pointer" onclick="analyzeNotice('${email.body.replace(/'/g, "\\'")}')">
                        <div class="flex justify-between items-start mb-2">
                            <span class="font-bold text-slate-800 text-sm"><i class="fas fa-envelope text-slate-400 mr-2"></i>${email.sender}</span>
                            <span class="text-xs text-slate-500">${email.date}</span>
                        </div>
                        <h4 class="font-bold text-slate-700 text-sm mb-1">${email.subject}</h4>
                        <p class="text-slate-500 text-xs truncate mb-3">${email.body}</p>
                        <button class="text-xs bg-blue-100 text-blue-700 font-bold py-1 px-3 rounded hover:bg-blue-200 transition-colors">
                            <i class="fas fa-bolt mr-1"></i> Auto-Analyze
                        </button>
                    </div>
                `).join('');
                document.getElementById('inbox-container').innerHTML = inboxHtml;
                
            } catch (e) {
                document.getElementById('inbox-container').innerHTML = '<span class="text-red-500 text-sm">Failed to load inbox</span>';
            }
        }

        // Analyze specific notice
        async function analyzeNotice(noticeText) {
            const panel = document.getElementById('analysis-panel');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            
            panel.classList.remove('hidden');
            loading.classList.remove('hidden');
            results.classList.add('hidden');
            
            // Scroll to panel
            panel.scrollIntoView({ behavior: 'smooth' });
            
            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ disruption_notice: noticeText })
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    throw new Error(data.detail || 'Server returned an error');
                }
                
                document.getElementById('summary').innerHTML = `
                    <span class="${data.has_impact ? 'text-red-600 font-bold' : 'text-green-600 font-bold'}">
                        ${data.has_impact ? '<i class="fas fa-exclamation-triangle"></i> CRITICAL IMPACT DETECTED' : '<i class="fas fa-check-circle"></i> NO DISRUPTION DETECTED'}
                    </span><br><span class="text-sm mt-1 inline-block text-slate-600">${data.summary}</span>
                `;
                
                const ordersDiv = document.getElementById('affected-orders');
                ordersDiv.innerHTML = '';
                
                if (data.affected_orders && data.affected_orders.length > 0) {
                    data.affected_orders.forEach(order => {
                        let optionsHtml = order.options.map(opt => `
                            <div class="mb-2 bg-white p-2 border border-slate-200 rounded">
                                <span class="font-bold text-sm text-slate-700"><i class="fas fa-arrow-right text-blue-500 mr-1"></i> ${opt.action}</span><br>
                                <span class="text-xs text-slate-500 italic ml-4">Trade-off: ${opt.trade_offs}</span>
                            </div>
                        `).join('');
                        
                        let urgencyClass = order.urgency.toLowerCase() === 'high' ? 'bg-red-100 text-red-800 border-red-200' : 'bg-yellow-100 text-yellow-800 border-yellow-200';
                        
                        ordersDiv.innerHTML += `
                            <div class="border p-4 rounded-lg bg-slate-50 shadow-sm">
                                <div class="flex justify-between items-center mb-3 border-b border-slate-200 pb-2">
                                    <span class="font-bold text-slate-800"><i class="fas fa-box text-slate-400 mr-2"></i>${order.order_id} - ${order.customer}</span>
                                    <span class="px-2 py-1 rounded text-xs font-bold uppercase border ${urgencyClass}">${order.urgency} Priority</span>
                                </div>
                                <p class="mb-4 text-slate-700 text-sm leading-relaxed">${order.impact_details}</p>
                                <h4 class="font-bold text-xs text-slate-500 uppercase tracking-wide mb-2">Available Options</h4>
                                ${optionsHtml}
                            </div>
                        `;
                    });
                } else {
                    ordersDiv.innerHTML = '<div class="p-4 border border-green-200 rounded-lg bg-green-50 text-green-700 font-medium"><i class="fas fa-shield-alt mr-2"></i> All customer orders are safe. Buffer stock is sufficient.</div>';
                }
                
                document.getElementById('recommendation').innerText = data.recommended_course;
                results.classList.remove('hidden');
            } catch (e) {
                console.error(e);
                document.getElementById('summary').innerHTML = '<span class="text-red-600 font-bold"><i class="fas fa-times-circle mr-2"></i>System Error</span>';
                document.getElementById('affected-orders').innerHTML = `<div class="p-4 bg-red-50 text-red-700 rounded border border-red-200 text-sm font-mono break-all">${e.message}</div>`;
                document.getElementById('recommendation').innerText = 'Please ensure your Google AI Studio GEMINI_API_KEY is correctly set in the environment.';
                results.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        }

        // Init
        loadDatabase();
        loadInbox();
    </script>
</body>
</html>
